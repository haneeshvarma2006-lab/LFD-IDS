# LFD-IDS default experiment configuration.
# Every key here mirrors a field of lfd_ids.config; anything omitted keeps its
# dataclass default. Override single keys from the CLI with, e.g.:
#   lfd-ids run --set model.epochs=50 --set attack.intensities=0.3,0.5

seed: 42
output_dir: results
attacks: [BOOTLFA, BAGLFA]
n_repeats: 1
save_figures: true

# ---------------------------------------------------------------- Module 1
acquisition:
  n_vehicles: 40
  samples_per_vehicle: 500
  malicious_ratio: 0.50        # balanced, so 50% accuracy == random guessing
  sampling_hz: 1.0
  region: [12.90, 13.10, 77.55, 77.75]
  n_routes: 8
  ambient_temp_c: 28.0
  nominal_pressure_psi: 34.0
  sensor_noise: 1.0
  packet_loss_rate: 0.01       # V2V/V2I channel
  latency_ms_mean: 22.0
  latency_ms_std: 6.0
  clock_skew_ms: 35.0
  drop_invalid_records: true
  feature_set: [tyre_temperature, tyre_pressure, latitude, longitude]
  database_path: results/cloud_db.sqlite
  # Point csv_path at a real capture to bypass the simulator entirely:
  # csv_path: data/real_cv_capture.csv
  # csv_label_column: label

# ---------------------------------------------------------------- Module 2
attack:
  intensities: [0.30, 0.40, 0.50]
  n_estimators: 10             # B: bootstrap resamples / bagging subsets
  subset_fraction: 0.8         # BAGLFA subset size, as a fraction of N
  selection: random            # random | benign_to_malicious
                               # | malicious_to_benign | boundary
  train_ensemble: true         # also train M_1..M_B and their aggregator
  attacker_knowledge: white_box
  attacker_access: mitm
  attacker_scope: fleet

# ---------------------------------------------------------------- Module 3
preprocess:
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
  scaler: minmax
  stratify: true

model:
  hidden_units: [64, 32, 16, 8]
  activations: [relu, tanh, relu, tanh]
  output_activation: sigmoid
  learning_rate: 0.001
  epochs: 200
  batch_size: 64
  l2: 0.0
  early_stopping_patience: 0   # 0 = train to convergence (the vulnerable
                               # pipeline the project is characterising)
  backend: auto                # auto -> numpy; set 'keras' for TensorFlow
  verbose: 0

alert:
  decision_threshold: 0.5
  consecutive_trigger: 3
  broadcast_model: true

# ---------------------------------------------------------------- Module 4
defence:
  n_clusters: 2
  max_iter: 300
  tol: 1.0e-6
  n_init: 10
  label_assignment: auto       # majority | anchor | auto
  majority_margin: 0.10
  trusted_fraction: 0.05
  threshold_scope: per_cluster # per_cluster | global
  threshold_scale: 1.0
  outer_policy: drop           # drop | keep | downweight
  outer_weight: 0.25
